name: 二次构建并发布Release
on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: 【应急手动】版本号 v1.0.x（优先A仓库填写）
        required: false
  repository_dispatch:
    types: [b-dist-ready]

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 拉取C仓库源码
        uses: actions/checkout@v4

      - name: 拉取B仓库dist资源
        uses: actions/checkout@v4
        with:
          repository: XDTX-01/dickson-dist
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: b-dist

      - name: 原样复制B/dist到C/src
        shell: pwsh
        run: |
          Copy-Item -Path "./b-dist/dist/*" -Destination "./src/" -Recurse -Force

      - name: 配置Node22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 读取版本（优先A传参）
        id: set_info
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.new_tag }}" -ne "") {
            $tag = "${{ github.event.inputs.new_tag }}"
          } else {
            $payload = '${{ toJson(github.event.client_payload) }}' | ConvertFrom-Json
            $tag = $payload.new_tag
          }
          $ver = $tag.TrimStart('v')
          $title = "dickson-color-$tag"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VER=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TITLE=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 强制覆盖package.json版本
        shell: pwsh
        run: |
          $ver = "${{ steps.set_info.outputs.VER }}"
          $pkg = Get-Content "package.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Out-File "package.json" -Encoding utf8

      - name: 打印校验json
        run: cat package.json

      - name: Electron打包
        run: npm run build

      - name: 发布Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_info.outputs.TAG }}
          name: ${{ steps.set_info.outputs.TITLE }}
          body: "版本 ${{ steps.set_info.outputs.TAG }}，源头A仓库，自动同步构建"
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
