name: LaLaLa

on:
  repository_dispatch:
    types: [b-dist-ready]
  workflow_dispatch:
    inputs:
      new_tag:
        description: 手动指定版本号 vx.x.x
        required: false

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 拉取C仓库源码
        uses: actions/checkout@v4

      - name: 拉取B中转仓库dist资源
        uses: actions/checkout@v4
        with:
          repository: XDTX-01/dickson-dist
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: b-resource

      - name: 镜像同步资源，清理.trigger
        shell: pwsh
        run: |
          robocopy .\b-resource\dist .\src /MIR /NFL /NDL
          if (Test-Path .\src\.trigger) { Remove-Item .\src\.trigger -Force }

      - name: 设置Node22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 解析版本参数
        id: parse-ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.new_tag }}" -ne "") {
            $tag = "${{ github.event.inputs.new_tag }}"
            $title = "dickson-color-$tag"
          } else {
            try {
              $payload = '${{ toJson(github.event.client_payload) }}' | ConvertFrom-Json
              $tag = $payload.new_tag
              $title = $payload.release_title
            } catch {
              throw "事件payload解析失败"
            }
          }
          if ([string]::IsNullOrEmpty($tag)) {
            throw "版本号为空"
          }
          $ver = $tag.TrimStart('v')
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "VER=$ver" >> $env:GITHUB_OUTPUT
          echo "TITLE=$title" >> $env:GITHUB_OUTPUT

      - name: 写入版本号到package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ steps.parse-ver.outputs.VER }}"
          $pkg | ConvertTo-Json -Depth 10 | Out-File package.json -Encoding utf8

      - name: Electron打包
        run: npm run package

      - name: 校验exe产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe -ErrorAction SilentlyContinue
          if (-not $exe) {
            throw "打包失败，dist无exe文件"
          }

      - name: 创建Release并上传文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse-ver.outputs.TAG }}
          name: ${{ steps.parse-ver.outputs.TITLE }}
          body: "版本 ${{ steps.parse-ver.outputs.TAG }}，由A仓库自动同步触发"
          files: |
            dist/*.exe
            dist/*.blockmap
