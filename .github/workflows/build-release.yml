name: 二次构建并发布Release
on:
  repository_dispatch:
    types: [b-dist-ready]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 拉取C仓库源码
        uses: actions/checkout@v4

      - name: 拉取B中转仓库dist资源
        uses: actions/checkout@v4
        with:
          repository: XDTX/dickson-dist
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: b-dist

      - name: 覆盖前端资源到src
        shell: pwsh
        run: |
          Copy-Item -Path "./b-dist/dist/*" -Destination "./src/" -Recurse -Force

      - name: 配置Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 读取版本payload
        id: set_info
        shell: pwsh
        run: |
          $payload = '${{ toJson(github.event.client_payload) }}' | ConvertFrom-Json
          $tag = $payload.new_tag
          $ver = $tag.TrimStart('v')
          $title = $payload.release_title
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VER=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TITLE=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 修改package.json版本
        shell: pwsh
        run: |
          $ver = "${{ steps.set_info.outputs.VER }}"
          $pkg = Get-Content "package.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Out-File "package.json" -Encoding utf8

      - name: 校验版本
        run: cat package.json

      - name: Electron打包
        run: npm run package

      - name: 发布Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_info.outputs.TAG }}
          name: ${{ steps.set_info.outputs.TITLE }}
          body: "版本 ${{ steps.set_info.outputs.TAG }}，由A仓库自动计算版本同步构建"
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
