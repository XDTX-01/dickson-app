name: 二次构建并发布Release
on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: 手动单独运行C时填写tag（如v1.0.7）
        required: true
        default: v1.0.7
  repository_dispatch:
    types: [b-dist-ready]

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取C仓库源码
        uses: actions/checkout@v4

      - name: 拉取B仓库的dist资源（main分支）
        uses: actions/checkout@v4
        with:
          repository: XDTX-01/dickson-dist
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: b-source

      - name: 将B的dist复制到C项目目录
        run: |
          rm -rf ./dist
          cp -r ./b-source/dist ./

      - name: 配置Node20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 执行C项目二次构建命令
        run: |
          npm ci
          npm run build

      - name: 打包最终dist为zip
        run: zip -r final-dist.zip dist

      - name: 读取tag和标题（自动触发/手动触发兼容）
        id: set_info
        run: |
          if [[ "${{ github.event.inputs.new_tag }}" != "" ]]; then
            TAG="${{ github.event.inputs.new_tag }}"
            VER=${TAG#v}
            TITLE="dickson-color-v${VER}"
          else
            TAG="${{ github.event.client_payload.new_tag }}"
            TITLE="${{ github.event.client_payload.release_title }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TITLE=$TITLE" >> $GITHUB_OUTPUT

      - name: 创建Release并上传压缩包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_info.outputs.TAG }}
          name: ${{ steps.set_info.outputs.TITLE }}
          body: "自动构建产物\nTag：${{ steps.set_info.outputs.TAG }}\n来源：A仓库手动启动流水线"
          files: final-dist.zip
