name: LaLaLa

# 接收 A 仓库（Vue 前端）发来的 b-dist-ready 事件；
# workflow_dispatch 仅作应急手动触发（可填 new_tag，留空则自动取最新 Release 补丁 +1）
on:
  repository_dispatch:
    types: [b-dist-ready]
  workflow_dispatch:
    inputs:
      new_tag:
        description: "【应急手动】版本号，如 v1.0.x（正常由 A 仓库传入，留空则自动 +1）"
        required: false
        default: ""

# 同一时间只允许一个发布任务，避免并发重复发版
concurrency:
  group: la-la-la-release
  cancel-in-progress: false

jobs:
  build-release:
    # 固定 windows-2022：windows-latest 现带的是 VS18(Insider)，node-gyp 10 无法识别
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: 拉取 C 仓库源码
        uses: actions/checkout@v4

      - name: 拉取 B 中转仓库 dist 资源
        uses: actions/checkout@v4
        with:
          repository: XDTX-01/dickson-dist
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: b-dist

      - name: 清理 src、复制 dist、兜底删除 map（图片原样保留）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -LiteralPath "./src" -Force |
            Where-Object { $_.Name -notin @("icon.ico", "preload.js") } |
            Remove-Item -Recurse -Force
          Copy-Item -Path "./b-dist/dist/*" -Destination "./src/" -Recurse -Force
          $maps = @(Get-ChildItem -LiteralPath "./src" -Recurse -Force -Filter "*.map")
          if ($maps.Count -gt 0) { $maps | Remove-Item -Force }
          "src 文件数: " + (Get-ChildItem -LiteralPath "./src" -Recurse -File | Measure-Object).Count

      - name: 配置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 加固链路的回归测试全部跑在纯 Node 上（自带一次性密钥与本地 HTTP 服务），
      # 不依赖 electron / native / 真机密钥。这一步红就等于加固被改坏了，直接停发布
      - name: 运行加固回归测试
        run: npm test

      - name: 编译 C++ 原生保护模块（L3）
        run: npm run build:native

      - name: 放置原生模块产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "./protect" | Out-Null
          Copy-Item -Path "./protect/build/Release/protect.node" -Destination "./protect/protect.node" -Force

      - name: 混淆并编译字节码（L1+L2）
        run: npm run protect

      - name: 解析版本号（A 传入 > 手动输入 > 最新 Release 补丁+1）
        id: set_info
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.new_tag }}
          PAYLOAD_TAG: ${{ github.event.client_payload.new_tag }}
          PAYLOAD_TITLE: ${{ github.event.client_payload.release_title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "$env:INPUT_TAG"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "$env:PAYLOAD_TAG" }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            $headers = @{
              Authorization = "token $env:GH_TOKEN"
              Accept        = "application/vnd.github+json"
              "User-Agent"  = "dickson-actions"
            }
            try {
              $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/XDTX-01/dickson-app/releases/latest" -Headers $headers
              $latest = "$($resp.tag_name)".TrimStart("v")
            } catch {
              $latest = "0.0.0"
            }
            $p = $latest.Split(".") | ForEach-Object { [int]$_ }
            while ($p.Count -lt 3) { $p += 0 }
            $p[2] += 1
            $tag = "v" + ($p -join ".")
            Write-Host "未收到版本参数，自动递增为 $tag"
          }

          $ver = "$tag".TrimStart("v")
          if ($ver -notmatch '^[0-9]+\.[0-9]+\.[0-9]+') {
            throw "版本号格式不合法：$tag（应为 v1.0.x）"
          }
          $tag = "v$ver"

          $title = "$env:PAYLOAD_TITLE"
          if ([string]::IsNullOrWhiteSpace($title)) { $title = "dickson-color-$tag" }

          "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VER=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TITLE=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "本次发布：TAG=$tag / TITLE=$title"

      - name: 强制写入版本号到 package.json（与 tag 保持一致）
        shell: pwsh
        env:
          VER: ${{ steps.set_info.outputs.VER }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node -e "console.log('package.json version =', require('./package.json').version)"

      - name: 移除明文主程序并打包（NSIS maximum）
        shell: pwsh
        run: |
          # main.js 已编译进 app.jsc，生产包不保留明文源码（本地回退才需要它）
          Remove-Item -Force -ErrorAction SilentlyContinue ./main.js
          npm run package

      # fuses 全靠配置写进 exe，写错不会报错、包照样能跑，所以必须读回来验证
      - name: 校验 exe 内的 fuse 线
        shell: pwsh
        run: node scripts/check-fuses.js

      # 给 latest.yml 签名（私钥只在 Secrets 里，从不落到仓库或磁盘 artifacts）
      - name: 签名更新清单 latest.yml
        shell: pwsh
        env:
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace("$env:UPDATE_SIGN_KEY")) {
            throw "缺少 UPDATE_SIGN_KEY，开了验签却签不出来，客户端会拒绝所有更新"
          }
          node scripts/sign-update.js --yml dist/latest.yml

      - name: 验签自检（清单 + 签名 + 版本）
        shell: pwsh
        env:
          VER: ${{ steps.set_info.outputs.VER }}
        run: node scripts/verify-update-sig.js --yml dist/latest.yml --sig dist/latest.yml.sig --expect-version "$env:VER"

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_info.outputs.TAG }}
          name: ${{ steps.set_info.outputs.TITLE }}
          body: "版本 ${{ steps.set_info.outputs.TAG }}，由 A 仓库自动同步触发构建"
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/latest.yml.sig
          fail_on_unmatched_files: true

      # 放在最后一步：Release 先落地（产物有备份），再往 COS 传更新源。
      # 顺序反过来时，Runner 到国内 COS 一旦限速/断连，整个发布全红，连安装包都拿不到。
      - name: 上传到腾讯云 COS（generic 更新源）
        shell: pwsh
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          $ErrorActionPreference = "Stop"
          $bucket = "$env:COS_BUCKET"; if ([string]::IsNullOrWhiteSpace($bucket)) { $bucket = "dickson-app-1313952720" }
          $region = "$env:COS_REGION"; if ([string]::IsNullOrWhiteSpace($region)) { $region = "ap-guangzhou" }

          # coscli 固定版本，避免上游行为变化把发布流程搞挂
          $coscli = "coscli.exe"
          if (-not (Test-Path $coscli)) {
            Invoke-WebRequest -Uri "https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-windows-amd64.exe" -OutFile $coscli
          }
          Get-Item $coscli | Select-Object Name, Length

          pwsh -NoProfile -File scripts/push-cos.ps1 -Dist dist -Bucket $bucket -Region $region -Prefix app-update -Coscli $coscli
