name: 二次构建并发布Release
on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: "手动指定tag（如 v1.0.9）；留空则自动取最新Release补丁+1"
        required: false
        default: ""
  repository_dispatch:
    types: [b-dist-ready]

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
      releases: write
    steps:
      - name: 拉取C仓库源码
        uses: actions/checkout@v4

      - name: 拉取B仓库dist资源（main分支）
        uses: actions/checkout@v4
        with:
          repository: XDTX-01/dickson-dist
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: b-dist

      - name: 原样复制B仓库dist到C仓库src（完全保留目录结构）
        shell: pwsh
        run: |
          Copy-Item -Path "./b-dist/dist/*" -Destination "./src/" -Recurse -Force

      - name: 配置Node22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 解析tag（留空自动取最新Release补丁+1）
        id: set_info
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.event.inputs.new_tag }}" -ne "") {
            $tag = "${{ github.event.inputs.new_tag }}"
          } else {
            $headers = @{ Authorization = "token $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "User-Agent" = "dickson-actions" }
            try {
              $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/XDTX-01/dickson-app/releases/latest" -Headers $headers
              $latest = $resp.tag_name.TrimStart('v')
            } catch {
              $latest = "0.0.0"
            }
            $p = $latest.Split('.') | ForEach-Object { [int]$_ }
            while ($p.Count -lt 3) { $p += 0 }
            $p[2] += 1
            $ver = $p -join '.'
            $tag = "v$ver"
          }
          $ver = $tag.TrimStart('v')
          $title = "dickson-color-v$ver"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VER=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TITLE=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 同步package.json版本号为tag版本
        shell: pwsh
        env:
          VER: ${{ steps.set_info.outputs.VER }}
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.env.VER; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"

      - name: Electron打包Windows安装包
        run: npm run package

      - name: 创建Release并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_info.outputs.TAG }}
          name: ${{ steps.set_info.outputs.TITLE }}
          body: "自动构建产物 ${{ steps.set_info.outputs.TAG }}，由A仓库流水线同步前端后触发"
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
