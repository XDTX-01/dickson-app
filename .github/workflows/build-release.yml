name: 二次构建并发布Release
on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: 版本tag，例如 v1.0.8
        required: true
        default: v1.0.8
  repository_dispatch:
    types: [b-dist-ready]

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取C仓库源码
        uses: actions/checkout@v4

      - name: 拉取B仓库dist资源
        uses: actions/checkout@v4
        with:
          repository: XDTX-01/dickson-dist
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: b-source

      - name: 覆盖dist目录
        run: |
          rm -rf ./dist
          cp -r ./b-source/dist ./

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci
        # 锁文件没修好的时候临时改成 npm install

      - name: 解析版本信息
        id: parse-ver
        run: |
          if [[ "${{ github.event.inputs.new_tag }}" != "" ]]; then
            TAG="${{ github.event.inputs.new_tag }}"
          else
            TAG="${{ github.event.client_payload.new_tag }}"
          fi
          VER=${TAG#v}
          TITLE="dickson-color-v${VER}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VER=$VER" >> $GITHUB_OUTPUT
          echo "TITLE=$TITLE" >> $GITHUB_OUTPUT

      - name: Electron Builder 打包
        run: npm run build

      - name: 创建Release，上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse-ver.outputs.TAG }}
          name: ${{ steps.parse-ver.outputs.TITLE }}
          body: |
            自动构建版本 ${{ steps.parse-ver.outputs.TAG }}
            由A仓库流水线自动同步dist并触发打包
          files: |
            ./dist/dickson-color-studio-Setup-${{ steps.parse-ver.outputs.VER }}.exe
            ./dist/dickson-color-studio-Setup-${{ steps.parse-ver.outputs.VER }}.exe.blockmap
            ./dist/latest.yml
