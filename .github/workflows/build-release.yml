name: 接收B资源，执行Release发布
on:
  repository_dispatch:
    types: [b-dist-ready]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 读取上游传入版本
        id: payload
        run: |
          echo "NEW_TAG=${{ github.event.client_payload.new_tag }}" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=${{ github.event.client_payload.release_title }}" >> $GITHUB_OUTPUT

      - name: 拉取中转仓库B dickson-dist
        uses: actions/checkout@v4
        with:
          repository: XDTX-01/dickson-dist
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: b-dist

      - name: 打包dist为发布压缩包
        run: |
          cd b-dist
          zip -r dist.zip dist/

      - name: 创建Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.payload.outputs.NEW_TAG }}
          name: ${{ steps.payload.outputs.RELEASE_TITLE }}
          files: b-dist/dist.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
