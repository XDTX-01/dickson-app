name: 二次构建并发布Release
on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: 手动运行时填写tag，如 v1.0.5
        required: true
        default: v1.0.5
  repository_dispatch:
    types: [b-dist-ready]

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 拉取C仓库源码
        uses: actions/checkout@v4

      - name: 拉取B仓库dist资源（main分支）
        uses: actions/checkout@v4
        with:
          repository: XDTX-01/dickson-dist
          ref: main
          token: ${{ secrets.REPO_TOKEN }}
          path: b-dist

      - name: 原样复制B仓库dist到C仓库src（完全保留目录结构）
        shell: pwsh
        run: |
          Copy-Item -Path "./b-dist/dist/*" -Destination "./src/" -Recurse -Force

      - name: 配置Node22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 解析tag和标题
        id: set_info
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.new_tag }}" -ne "") {
            $tag = "${{ github.event.inputs.new_tag }}"
            $ver = $tag.TrimStart('v')
            $title = "dickson-color-v$ver"
          } else {
            $payload = '${{ toJson(github.event.client_payload) }}' | ConvertFrom-Json
            $tag = $payload.new_tag
            $title = $payload.release_title
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TITLE=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Electron打包Windows安装包
        run: npm run package

      - name: 创建Release并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set_info.outputs.TAG }}
          name: ${{ steps.set_info.outputs.TITLE }}
          body: "自动构建产物 ${{ steps.set_info.outputs.TAG }}，由A仓库流水线同步前端后触发"
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
